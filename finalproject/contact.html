<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoops Central - Contact</title>
    <meta name="description" content="Get in touch with us or subscribe to basketball updates.">
    <meta name="author" content="Rich Kevin Panozo Vargas">
    <link rel="icon" type="image/x-icon"
        href="https://images.unsplash.com/photo-1546519638-68e109498ffc?w=32&auto=format&fit=crop&q=80">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <h1>Hoops Central</h1>
        <button class="menu-toggle" id="menu-toggle" aria-label="Open menu">☰</button>
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="players.html">Players</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contact & Subscription Form</h2>
        <form action="form-action.html" method="get">
            <div class="form-group">
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="teamfav">Favorite Team:</label>
                <select id="teamfav" name="teamfav">
                    <option value="Lakers">Los Angeles Lakers</option>
                    <option value="Warriors">Golden State Warriors</option>
                    <option value="Bulls">Chicago Bulls</option>
                    <option value="Celtics">Boston Celtics</option>
                </select>
            </div>
            <button type="submit" class="btn">Submit Data</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Hoops Central. All rights reserved.</p>
        <p><a href="https://www.youtube.com" target="_blank">Project Demonstration Video</a> | <a href="#"
                target="_blank">Attributions</a></p>
    </footer>

    <script type="module" src="app.js"></script>
</body>

</html>
